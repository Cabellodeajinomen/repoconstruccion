<h2>Lista de servicios</h2>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Servicio</th>
      <th>Categoría</th>
      <th>Duración</th>
      <th>Precio</th>
      <th>Acciones</th>
    </tr>
  </thead>

  <tbody>
    @for (servicio of servicios; track servicio.id) {
      <tr>
        <td>{{ servicio.id }}</td>
        <td>{{ servicio.nombre }}</td>
        <td>{{ servicio.categoria }}</td>
        <td>{{ servicio.duracion }}</td>
        <td>{{ servicio.precio }}</td>
        <td>
          <button (click)="editarServicio(servicio)">Editar</button>
        </td>
      </tr>
    } @empty {
      <tr>
        <td colspan="6">No hay servicios disponibles</td>
      </tr>
    }
  </tbody>
</table>

@if (mostrarModal) {
  <app-modal-servicio
    [servicio]="servicioSeleccionado"
    (cerrar)="cerrarModal()"
    (guardar)="guardarServicio($event)">
  </app-modal-servicio>
}
