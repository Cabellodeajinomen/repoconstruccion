<h2>Lista de clientes</h2>
<button (click)="irAClienteNuevo()">
  Nuevo Cliente
</button>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Nombre</th>
      <th>DNI</th>
      <th>Email</th>
      <th>Tipo</th>
    </tr>
  </thead>

  <tbody>
    @for (cliente of clientes; track cliente.id) {
      <tr>
        <td>{{ cliente.id }}</td>
        <td>{{ cliente.nombreCompleto }}</td>
        <td>{{ cliente.dni }}</td>
        <td>{{ cliente.email }}</td>
        <td>{{ cliente.tipoCliente }}</td>
      </tr>
    } @empty {
      <tr>
        <td colspan="5">No hay clientes disponibles</td>
      </tr>
    }
  </tbody>
</table>
