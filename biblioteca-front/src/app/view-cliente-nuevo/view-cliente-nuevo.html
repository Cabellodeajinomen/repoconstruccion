<div class="container mt-4">
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0">Registrar nuevo cliente</h4>
    </div>
    <div class="card-body">
      <form #clienteForm="ngForm" (ngSubmit)="guardar()">

        <div class="mb-3">
          <label class="form-label">Nombre completo</label>
          <input type="text" class="form-control" name="nombreCompleto"
            [(ngModel)]="cliente.nombreCompleto" #nombre="ngModel"
            required minlength="5" placeholder="Ej. Lucía Fernández Paredes">
          @if (nombre.invalid && nombre.touched) {
            <small class="text-danger">El nombre es obligatorio (mínimo 5 letras).</small>
          }
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">DNI</label>
            <input type="text" class="form-control" name="dni"
              [(ngModel)]="cliente.dni" #dni="ngModel"
              required pattern="^[0-9]{8}$" maxlength="8" placeholder="8 dígitos">
            @if (dni.invalid && dni.touched) {
              <small class="text-danger">El DNI debe tener 8 dígitos.</small>
            }
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Tipo de cliente</label>
            <select class="form-select" name="idTipoCliente" [(ngModel)]="cliente.idTipoCliente">
              @for (t of tiposCliente; track t.id) {
                <option [ngValue]="t.id">{{ t.nombre }}</option>
              }
            </select>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" name="email"
            [(ngModel)]="cliente.email" #email="ngModel"
            required email placeholder="usuario@correo.pe">
          @if (email.invalid && email.touched) {
            <small class="text-danger">Ingrese un correo válido.</small>
          }
        </div>

        @if (mensajeError) {
          <div class="alert alert-danger">{{ mensajeError }}</div>
        }

        <hr>
        <div class="d-flex justify-content-end gap-2">
          <a routerLink="/clientes" class="btn btn-outline-secondary">Volver</a>
          <button type="button" class="btn btn-secondary" (click)="limpiar()">Limpiar</button>
          <button type="submit" class="btn btn-primary" [disabled]="clienteForm.invalid">
            Guardar cliente
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
